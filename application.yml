server:
  port: ${PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177-SNAPSHOT"
      snapshot: true
  pluginsDir: "./plugins"
  server:
    password: "LightCore-Music-Node-2026"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
    useSeekGhosting: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Playback-capable clients first. MUSIC is search-only and stays last.
    clients:
      - IOS
      - ANDROID_MUSIC
      - ANDROID_VR
      - WEB
      - MWEB
      - TVHTML5_SIMPLY
      - WEBEMBEDDED
      - MUSIC

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
