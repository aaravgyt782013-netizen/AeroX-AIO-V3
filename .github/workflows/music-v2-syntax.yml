name: Music V2 syntax check

on:
  push:
    branches: [music-v2-rebuild]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find src/commands/RythmMusic src/events/discord/music -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/managers/MusicSearchEngine.js
          node --check src/managers/MusicEngine.js
          node --check src/managers/SpotifyCatalog.js
          node --check src/utils/MusicCore.js
          node --check src/utils/RythmCommands.js
          node --check src/commands/info/help.js
          node --check src/events/discord/guild/Prefixcmd.js
